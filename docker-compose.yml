services:
  homedash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homedash
    # D-A. Bind a todas las interfaces (NPM reverse proxy necesita acceso)
    ports:
      - "8060:8060"
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      # Permite editar plantillas en caliente sin rebuild
      - ./templates:/app/templates
      # Persistencia de la caché de deportes y la caché de escudos dinámica
      - ./data:/app/data
      - ./static/assets/cache:/app/static/assets/cache
    restart: unless-stopped
    # D-C. Drop all capabilities
    cap_drop:
      - ALL
    # D-B. Límites de recursos (v2 compatibles)
    mem_limit: 128M
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
