{{define "layout"}}
<!DOCTYPE html>
<html lang="es" class="h-full" data-theme="{{.Theme}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" href="/static/favicon.png" type="image/png">
    <title>HomeDash</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js" integrity="sha384-prOTt12iGU6/k2uoXJ3az4BWS2qoxykgxJb6pjfmRK7MYOMnMe7bWWBMPZqxwVks" crossorigin="anonymous"></script>
    <script src="/static/app.js?v=20260807"></script>
    <script defer src="https://stats.cronix.com.ar/script.js" data-website-id="4d4a9986-30c0-42b0-9b37-6c0113ff6c03"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .fluid-clock { font-size: clamp(2rem, 8vw, 5rem); }
        .fluid-temp { font-size: clamp(2rem, 8vw, 5rem); }
        
        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); }
            50% { box-shadow: 0 0 40px rgba(245, 158, 11, 0.3); }
            100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); }
        }
        @keyframes borderRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .holiday-glow { 
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0.05) 100%);
            border-color: rgba(245, 158, 11, 0.6) !important;
            position: relative;
        }
        .holiday-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: transparent;
            z-index: -1;
            border-radius: 2rem;
        }
        .custom-modal { display: none; position: fixed; inset: 0; z-index: 9999; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); }
        .custom-modal.active { display: flex !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .holiday-glow { animation: none; }
            .holiday-glow::before { animation: none; }
            .confetti { display: none; }
        }

        /* Efecto Confetti */
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
        }
        .confetti-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 40;
        }
        .confetti {
            position: absolute;
            width: 4px;
            height: 6px;
            border-radius: 1px;
            animation: confetti-fall linear infinite;
        }

        /* Highlight para feriados próximos */
        @keyframes subtle-pulse {
            0% { background: rgba(245, 158, 11, 0.05); }
            50% { background: rgba(245, 158, 11, 0.15); }
            100% { background: rgba(245, 158, 11, 0.05); }
        }
        .holiday-item-near {
            animation: subtle-pulse 2s infinite ease-in-out;
            border-radius: 0.5rem;
            margin: 0 -0.5rem;
            padding: 0.1rem 0.5rem;
        }

        /* Efecto Lluvia */
        @keyframes rain-fall {
            0% { transform: translateY(-100px); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(300px); opacity: 0; }
        }
        .rain-wrapper {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8));
            animation: rain-fall 0.8s linear infinite;
        }
        [data-theme="nothing"] .drop {
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.6));
            width: 1.5px;
            height: 25px;
        }

        /* Efecto Rayos */
        @keyframes lightning-flash {
            0%, 95%, 98%, 100% { opacity: 0; }
            96% { opacity: 0.2; }
            97% { opacity: 0.5; }
            99% { opacity: 0.3; }
        }
        .lightning-overlay {
            position: absolute;
            inset: 0;
            background: white;
            pointer-events: none;
            z-index: 6;
            animation: lightning-flash 5s infinite;
        }

        /* Efecto Sismo Fuerte (Shake inicial + Pulse constante) */
        @keyframes quake-shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-2px, -1px); }
            20%, 40%, 60%, 80% { transform: translate(2px, 1px); }
        }
        @keyframes quake-pulse {
            0% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); border-color: rgba(255, 0, 0, 0.3); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 0, 0.5); border-color: rgba(255, 0, 0, 0.8); }
            100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); border-color: rgba(255, 0, 0, 0.3); }
        }
        .strong-quake-alert {
            animation: quake-shake 0.5s cubic-bezier(.36,.07,.19,.97) 6, quake-pulse 2s ease-in-out infinite 3s;
            border-width: 2px !important;
        }
        
        [data-theme="nothing"] body {
            background-color: #000000 !important;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff !important;
            font-family: 'Space Grotesk', sans-serif !important;
            padding: 0.5rem !important;
            overflow-x: hidden;
        }

        [data-theme="nothing"] .dashboard-container {
            gap: 0.5rem !important;
            padding: 0 !important;
        }

        [data-theme="nothing"] .bg-base-200 {
            background-color: #000000 !important;
            backdrop-filter: none !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 1rem !important;
            padding: 1.25rem !important;
            box-shadow: none !important;
        }

        [data-theme="nothing"] h1,
        [data-theme="nothing"] .fluid-clock {
            font-family: 'DotGothic16', sans-serif !important;
            letter-spacing: -0.05em !important;
            text-transform: uppercase !important;
            color: #ffffff !important;
        }

        [data-theme="nothing"] h2,
        [data-theme="nothing"] h3,
        [data-theme="nothing"] .fluid-temp {
            font-family: 'Space Grotesk', sans-serif !important;
            font-weight: 700 !important;
            letter-spacing: -0.02em !important;
            text-transform: uppercase !important;
        }

        [data-theme="nothing"] .text-[10px],
        [data-theme="nothing"] .text-[9px],
        [data-theme="nothing"] .text-xs,
        [data-theme="nothing"] .tracking-widest {
            font-family: 'Space Mono', monospace !important;
            text-transform: uppercase !important;
            letter-spacing: 0.15em !important;
            font-weight: 400 !important;
            color: rgba(255, 255, 255, 0.5) !important;
        }

        /* Acentos rojos industriales */
        [data-theme="nothing"] .text-error,
        [data-theme="nothing"] .bg-error\/20 i,
        [data-theme="nothing"] .text-red-500,
        [data-theme="nothing"] .text-red-400 {
            color: #D71921 !important;
        }
        
        [data-theme="nothing"] .bg-error\/20 {
            background-color: rgba(215, 25, 33, 0.1) !important;
            border: 1px solid rgba(215, 25, 33, 0.2) !important;
        }

        [data-theme="nothing"] .btn-primary,
        [data-theme="nothing"] .btn-error {
            background-color: #D71921 !important;
            border: none !important;
            color: #ffffff !important;
            border-radius: 4px !important;
            font-family: 'Space Mono', monospace !important;
            text-transform: uppercase !important;
            font-weight: 700 !important;
        }

        /* Espaciado de utilidad industrial */
        [data-theme="nothing"] .mb-12, [data-theme="nothing"] .mt-12, [data-theme="nothing"] .mt-4, [data-theme="nothing"] .mb-4 {
            margin-top: 1rem !important;
            margin-bottom: 1rem !important;
        }

        [data-theme="nothing"] .px-6 {
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }

        [data-theme="nothing"] i[data-lucide] {
            stroke-width: 1.25px;
            opacity: 0.7;
        }

        /* Dot Matrix Background para áreas específicas */
        [data-theme="nothing"] .dot-matrix-bg {
            background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px) !important;
            background-size: 8px 8px !important;
        }

        [data-theme="nothing"] #clock-container {
            border: 2px solid #ffffff !important;
            background-color: #000000 !important;
            min-height: 200px !important;
        }
    </style>
</head>
<body class="bg-base-100 text-base-content p-3 md:p-4 transition-all duration-700 select-none">
    <noscript>
        <div class="fixed inset-0 z-[999] bg-base-100 flex flex-col items-center justify-center p-8 text-center">
            <h1 class="text-3xl font-black text-error mb-4">JavaScript Requerido</h1>
            <p class="text-base-content/70">Homedash necesita JavaScript para funcionar.</p>
        </div>
    </noscript>

    {{template "content" .}}

    <!-- Modal de Configuración Permanente -->
    <div id="modal" class="custom-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="bg-base-200 border-2 border-base-content w-full max-w-md rounded-xl p-8 shadow-none relative overflow-hidden">
            <div class="dot-matrix-bg absolute inset-0 opacity-10 pointer-events-none"></div>
            <div class="relative z-10">
                <div class="flex justify-between items-center mb-10 border-b border-base-300 pb-4">
                    <h2 id="modal-title" class="text-xl font-black text-base-content uppercase tracking-widest">Ajustes</h2>
                    <button onclick="toggleModal()" class="text-base-content/40 hover:text-base-content transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                
                <form hx-post="/settings" hx-swap="none" class="space-y-8">
                    <div>
                        <label class="text-[10px] font-black text-base-content/40 uppercase tracking-[0.3em] block mb-4">Módulos Visibles</label>
                        <div class="space-y-2 mb-8">
                            <label for="showFootball" class="flex items-center justify-between p-4 bg-base-300/50 border border-base-300 hover:bg-base-300 transition-colors cursor-pointer rounded-lg">
                                <span class="text-xs font-black text-base-content uppercase tracking-widest flex items-center"><i data-lucide="trophy" class="w-4 h-4 mr-3 text-base-content/60"></i> Fútbol</span>
                                <input id="showFootball" type="checkbox" name="showFootball" {{if .ShowFootball}}checked{{end}} class="checkbox checkbox-sm rounded-none border-base-content/20 checked:bg-base-content checked:border-base-content">
                            </label>
                            <label for="showF1" class="flex items-center justify-between p-4 bg-base-300/50 border border-base-300 hover:bg-base-300 transition-colors cursor-pointer rounded-lg">
                                <span class="text-xs font-black text-base-content uppercase tracking-widest flex items-center"><i data-lucide="flag" class="w-4 h-4 mr-3 text-error"></i> F1</span>
                                <input id="showF1" type="checkbox" name="showF1" {{if .ShowF1}}checked{{end}} class="checkbox checkbox-sm rounded-none border-base-content/20 checked:bg-error checked:border-error">
                            </label>
                            <label for="showUFC" class="flex items-center justify-between p-4 bg-base-300/50 border border-base-300 hover:bg-base-300 transition-colors cursor-pointer rounded-lg">
                                <span class="text-xs font-black text-base-content uppercase tracking-widest flex items-center"><i data-lucide="swords" class="w-4 h-4 mr-3 text-error"></i> UFC</span>
                                <input id="showUFC" type="checkbox" name="showUFC" {{if .ShowUFC}}checked{{end}} class="checkbox checkbox-sm rounded-none border-base-content/20 checked:bg-error checked:border-error">
                            </label>
                            <label for="showFinance" class="flex items-center justify-between p-4 bg-base-300/50 border border-base-300 hover:bg-base-300 transition-colors cursor-pointer rounded-lg">
                                <span class="text-xs font-black text-base-content uppercase tracking-widest flex items-center"><i data-lucide="bitcoin" class="w-4 h-4 mr-3 text-base-content/60"></i> Finanzas</span>
                                <input id="showFinance" type="checkbox" name="showFinance" {{if .ShowFinance}}checked{{end}} class="checkbox checkbox-sm rounded-none border-base-content/20 checked:bg-base-content checked:border-base-content">
                            </label>
                        </div>

                        <label for="theme" class="text-[10px] font-black text-base-content/40 uppercase tracking-[0.3em] block mb-2">Tema</label>
                        <select id="theme" name="theme" class="w-full bg-base-300/50 border border-base-300 rounded-lg px-4 py-3 text-base-content focus:outline-none focus:border-base-content mb-6 appearance-none font-mono text-xs uppercase tracking-widest">
                            <option value="dark" {{if eq .Theme "dark"}}selected{{end}}>Dark</option>
                            <option value="nothing" {{if eq .Theme "nothing"}}selected{{end}}>Nothing</option>
                            <option value="dracula" {{if eq .Theme "dracula"}}selected{{end}}>Dracula</option>
                            <option value="synthwave" {{if eq .Theme "synthwave"}}selected{{end}}>Synthwave</option>
                            <option value="cyberpunk" {{if eq .Theme "cyberpunk"}}selected{{end}}>Cyberpunk</option>
                        </select>

                        <label for="team" class="text-[10px] font-black text-base-content/40 uppercase tracking-[0.3em] block mb-2">Equipo</label>
                        <input id="team" type="text" name="team" list="teams-list" placeholder="Boca" value="{{.Team}}"
                              hx-get="/autocomplete/teams" hx-trigger="keyup changed delay:300ms" hx-target="#teams-list" class="w-full bg-base-300/50 border border-base-300 rounded-lg px-4 py-3 text-base-content focus:outline-none focus:border-base-content mb-6 font-mono text-xs uppercase tracking-widest">
                        <datalist id="teams-list"></datalist>
                        
                        <label for="city" class="text-[10px] font-black text-base-content/40 uppercase tracking-[0.3em] block mb-2">Ciudad</label>
                        <input id="city" type="text" name="city" list="cities-list" placeholder="Mendoza" value="{{.City}}"
                               hx-get="/autocomplete/cities" hx-trigger="keyup changed delay:500ms" hx-target="#cities-list"
                               class="w-full bg-base-300/50 border border-base-300 rounded-lg px-4 py-3 text-base-content focus:outline-none focus:border-base-content font-mono text-xs uppercase tracking-widest">
                        <datalist id="cities-list"></datalist>
                    </div>
                    <button type="submit" class="w-full bg-base-content text-base-100 font-black uppercase py-4 rounded-lg transition-all tracking-[0.2em] text-xs hover:opacity-80" onclick="setTimeout(() => toggleModal(), 100)">
                        GUARDAR CONFIGURACIÓN
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Fixture Mundial -->
    <div id="fixture-modal" class="custom-modal fixed inset-0 z-[100] hidden items-center justify-center bg-base-100/95 transition-all duration-300" role="dialog" aria-modal="true" aria-labelledby="fixture-modal-title">
        <div class="bg-base-200 w-full h-full md:h-[98vh] md:w-[98vw] md:rounded-xl shadow-none relative overflow-hidden flex flex-col p-4 md:p-10 border border-base-300">
            <button onclick="toggleFixtureModal()" class="absolute top-6 right-6 text-base-content/40 hover:text-base-content z-50 p-2 border border-base-300 rounded-lg hover:bg-base-300/50 transition-all">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="flex flex-col mb-12 shrink-0 border-b border-base-300 pb-8">
                <h2 id="fixture-modal-title" class="text-4xl md:text-6xl font-black text-base-content uppercase tracking-tighter leading-none">MUNDIAL 2026</h2>
                <p class="text-[10px] font-black text-base-content/40 uppercase tracking-[0.5em] mt-4">FIXTURE Y RESULTADOS</p>
            </div>
            <div id="fixture-content" class="flex-1 overflow-y-auto custom-scrollbar">
                <div class="flex flex-col items-center justify-center py-32">
                    <span class="loading loading-ring loading-lg text-base-content"></span>
                    <p class="text-[11px] font-black text-base-content/20 uppercase tracking-[0.3em] mt-6 animate-pulse">SINCRONIZANDO DATOS...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Partidos del Día -->
    <div id="partidos-modal" class="custom-modal fixed inset-0 z-[100] hidden items-center justify-center bg-base-100/95 transition-all duration-300" role="dialog" aria-modal="true" aria-labelledby="partidos-modal-title">
        <div class="bg-base-200 w-full h-full md:h-[98vh] md:w-[98vw] md:rounded-xl shadow-none relative overflow-hidden flex flex-col p-4 md:p-10 border border-base-300">
            <button onclick="togglePartidosModal()" class="absolute top-6 right-6 text-base-content/40 hover:text-base-content z-50 p-2 border border-base-300 rounded-lg hover:bg-base-300/50 transition-all">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div id="partidos-content" class="flex-1 overflow-y-auto custom-scrollbar">
                <div class="flex flex-col items-center justify-center py-32">
                    <span class="loading loading-ring loading-lg text-primary"></span>
                    <p class="text-[11px] font-black text-base-content/20 uppercase tracking-[0.3em] mt-6 animate-pulse">BUSCANDO PARTIDOS...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Posiciones F1 -->
    <div id="f1-modal" class="custom-modal fixed inset-0 z-[100] hidden items-center justify-center bg-base-100/95 transition-all duration-300" role="dialog" aria-modal="true" aria-labelledby="f1-modal-title">
        <div class="bg-base-200 w-full h-full md:h-[98vh] md:w-[98vw] md:rounded-xl shadow-none relative overflow-hidden flex flex-col p-4 md:p-10 border border-base-300">
            <button onclick="toggleF1Modal()" class="absolute top-6 right-6 text-base-content/40 hover:text-base-content z-50 p-2 border border-base-300 rounded-lg hover:bg-base-300/50 transition-all">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="flex flex-col mb-12 shrink-0 border-b border-base-300 pb-8">
                <h2 id="f1-modal-title" class="text-4xl md:text-6xl font-black text-base-content uppercase tracking-tighter leading-none">POSICIONES F1</h2>
                <p class="text-[10px] font-black text-error uppercase tracking-[0.5em] mt-4">TEMPORADA 2026</p>
            </div>
            <div id="f1-content" class="flex-1 overflow-y-auto custom-scrollbar">
                <div class="flex flex-col items-center justify-center py-32">
                    <span class="loading loading-ring loading-lg text-error"></span>
                    <p class="text-[11px] font-black text-base-content/20 uppercase tracking-[0.3em] mt-6 animate-pulse">RECUPERANDO RANKING...</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
{{end}}
