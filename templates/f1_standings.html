<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 p-2">
    <!-- Pilotos -->
    <div class="bg-base-200 border border-base-300 rounded-xl p-5">
        <h3 class="text-sm font-black uppercase tracking-widest mb-6 text-error flex items-center">
            <i data-lucide="users" class="w-4 h-4 mr-2"></i> PILOTOS
        </h3>
        <div class="space-y-1">
            <div class="grid grid-cols-12 text-[11px] font-black uppercase text-base-content/40 pb-2 border-b border-base-300/50 px-2 tracking-widest">
                <div class="col-span-1">#</div>
                <div class="col-span-5">PILOTO</div>
                <div class="col-span-4">EQUIPO</div>
                <div class="col-span-2 text-right">PTS</div>
            </div>
            {{range .Drivers}}
            <div class="grid grid-cols-12 items-center text-xs font-bold py-2 border-b border-base-300/50 last:border-0 hover:bg-base-300/50 px-2 transition-colors">
                <div class="col-span-1 opacity-40 font-mono">{{.Pos}}</div>
                <div class="col-span-5 uppercase tracking-tight text-base-content">{{.Driver}}</div>
                <div class="col-span-4 text-[11px] text-base-content/40 font-mono uppercase truncate pr-2">{{.Team}}</div>
                <div class="col-span-2 text-right font-mono text-base-content">{{.Points}}</div>
            </div>
            {{end}}
        </div>
    </div>

    <!-- Constructores -->
    <div class="bg-base-200 border border-base-300 rounded-xl p-5">
        <h3 class="text-sm font-black uppercase tracking-widest mb-6 text-primary flex items-center">
            <i data-lucide="factory" class="w-4 h-4 mr-2"></i> CONSTRUCTORES
        </h3>
        <div class="space-y-1">
            <div class="grid grid-cols-12 text-[11px] font-black uppercase text-base-content/40 pb-2 border-b border-base-300/50 px-2 tracking-widest">
                <div class="col-span-1">#</div>
                <div class="col-span-7">EQUIPO</div>
                <div class="col-span-2 text-center">W</div>
                <div class="col-span-2 text-right">PTS</div>
            </div>
            {{range .Constructors}}
            <div class="grid grid-cols-12 items-center text-xs font-bold py-2 border-b border-base-300/50 last:border-0 hover:bg-base-300/50 px-2 transition-colors">
                <div class="col-span-1 opacity-40 font-mono">{{.Pos}}</div>
                <div class="col-span-7 uppercase tracking-tight text-base-content">{{.Team}}</div>
                <div class="col-span-2 text-center opacity-40 font-mono">{{.Wins}}</div>
                <div class="col-span-2 text-right font-mono text-base-content">{{.Points}}</div>
            </div>
            {{end}}
        </div>
    </div>
</div>
<script>
    lucide.createIcons();
</script>
