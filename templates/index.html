{{template "layout" .}}
{{define "content"}}
    <!-- Grid principal -->
    <div class="dashboard-container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-3">

        <!-- Clima y Deportes -->
        <div id="weather-display" hx-get="/weather" hx-trigger="load, every 60s, refreshWeather from:body" hx-swap="innerHTML" class="contents">
             <div class="lg:col-span-12 flex items-center justify-center bg-base-200/50 rounded-[2.5rem] border border-base-300/20 p-4 h-full">
                <div class="w-8 h-8 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
             </div>
        </div>
    </div>

    <!-- Footer: firma + módulos a la izquierda, Configuración a la derecha -->
    <div class="mt-2 mb-1 flex items-center justify-between gap-3 flex-wrap px-2">
        <div class="term-footer-signature text-[10px] font-bold uppercase tracking-[0.3em]">
            Homedash by <span class="term-footer-kastor font-black">kastor</span>
            <span class="opacity-50">·</span>
            <span class="opacity-50">MÓDULOS: FÚTBOL / F1 / UFC / FINANZAS</span>
        </div>
        <button onclick="toggleModal()" class="term-footer-btn text-[10px] font-black uppercase tracking-widest px-4 py-1.5 rounded-full border transition-all flex items-center">
            <i data-lucide="settings" class="w-3.5 h-3.5 mr-2"></i> CONFIGURACIÓN
        </button>
    </div>
{{end}}
