{{template "layout" .}}
{{define "content"}}
    <!-- Grid principal -->
    <div class="dashboard-container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-10 gap-1.5">
        
        <!-- 1. Tarjeta Reloj -->
        <div id="clock-container" 
             class="bg-base-200 backdrop-blur-xl rounded-[2.5rem] p-4 md:p-5 shadow-2xl border border-base-300 flex flex-col justify-center h-full min-h-[200px] md:min-h-[240px] lg:col-span-3 relative overflow-hidden {{if .Holiday}}holiday-glow{{end}}">
            <div id="clock-content" class="contents">
                {{if .Holiday}}
                <div class="absolute top-0 left-0 w-full p-2 bg-amber-500/20 border-b border-amber-500/30 flex items-center justify-center space-x-2">
                    <i data-lucide="party-popper" class="w-3 h-3 text-amber-500"></i>
                    <span class="text-[10px] font-black uppercase tracking-[0.2em] text-amber-500 italic">{{.Holiday.Name}}</span>
                    <i data-lucide="party-popper" class="w-3 h-3 text-amber-500"></i>
                </div>
                {{end}}
                <h1 id="clock" class="fluid-clock font-extrabold tracking-tighter text-base-content leading-none">00:00</h1>
                <p id="date" class="text-primary text-xs md:text-lg font-bold mt-1 capitalize"></p>
                {{if .UpcomingHolidays}}
                <div class="mt-3 pt-3 border-t border-base-300/50">
                    <div class="text-[11px] font-bold text-base-content/70 uppercase tracking-widest mb-2 italic">Próximos Feriados:</div>
                    <div class="space-y-1.5">
                        {{range .UpcomingHolidays}}
                        <div class="flex items-center justify-between text-sm text-amber-500/90 font-bold">
                            <span>{{.Name}}</span>
                            <span class="text-base-content/60 text-xs ml-2">{{.DayName}} {{.DateStr}}</span>
                        </div>
                        {{end}}
                    </div>
                </div>
                {{end}}
            </div>
        </div>

        <!-- 2. Clima y 3. Deportes -->
        <div id="weather-display" hx-get="/weather" hx-trigger="load, every 60s" hx-swap="innerHTML" class="contents">
             <div class="lg:col-span-7 flex items-center justify-center bg-base-200/50 rounded-[2.5rem] border border-base-300/20 p-10 h-full">
                <div class="w-8 h-8 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
             </div>
        </div>
    </div>

    <!-- Footer: Firma a la izquierda, Configuración a la derecha -->
    <div class="mt-2 mb-2 flex items-center justify-between px-6 opacity-50 hover:opacity-100 transition-opacity duration-500">
        <div class="text-[9px] font-bold text-base-content/60 uppercase tracking-[0.3em]">
            Homedash by <span class="text-primary font-black">kastor</span>
        </div>
        <button onclick="toggleModal()" class="text-base-content/60 hover:text-base-content transition-colors flex items-center text-[10px] font-black uppercase tracking-widest">
            <i data-lucide="settings" class="w-3.5 h-3.5 mr-2"></i> Configuración
        </button>
    </div>
{{end}}
