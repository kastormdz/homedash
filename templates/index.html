{{template "layout" .}}
{{define "content"}}
    <!-- Grid principal -->
    <div class="dashboard-container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-10 gap-1.5">
        
        <!-- 1. Tarjeta Reloj -->
        <div id="clock-container" 
             class="bg-base-200 backdrop-blur-xl rounded-[2.5rem] p-4 md:p-5 shadow-2xl border border-base-300 flex flex-col justify-center h-full min-h-[200px] md:min-h-[240px] lg:col-span-3 relative overflow-hidden dot-matrix-bg {{if .Holiday}}holiday-glow{{end}}">
            
            {{if .Holiday}}
            <div class="confetti-wrapper">
                <div class="confetti" style="left:5%; background:#ff4444; animation-duration:3.2s; animation-delay:0.1s;"></div>
                <div class="confetti" style="left:15%; background:#00ced1; animation-duration:2.9s; animation-delay:0.4s;"></div>
                <div class="confetti" style="left:25%; background:#44ff44; animation-duration:2.5s; animation-delay:2.1s;"></div>
                <div class="confetti" style="left:35%; background:#fbbf24; animation-duration:3.1s; animation-delay:1.2s;"></div>
                <div class="confetti" style="left:45%; background:#4444ff; animation-duration:3.6s; animation-delay:0.5s;"></div>
                <div class="confetti" style="left:55%; background:#f59e0b; animation-duration:3.4s; animation-delay:0.3s;"></div>
                <div class="confetti" style="left:65%; background:#ff44ff; animation-duration:2.8s; animation-delay:1.5s;"></div>
                <div class="confetti" style="left:75%; background:#44ffff; animation-duration:3.0s; animation-delay:1.8s;"></div>
                <div class="confetti" style="left:85%; background:#ffa500; animation-duration:3.8s; animation-delay:1.5s;"></div>
                <div class="confetti" style="left:95%; background:#7fff00; animation-duration:3.5s; animation-delay:1.1s;"></div>
                
                <div class="confetti" style="left:10%; background:#ff007f; animation-duration:3.1s; animation-delay:2.8s;"></div>
                <div class="confetti" style="left:30%; background:#ffff44; animation-duration:4.0s; animation-delay:0.9s;"></div>
                <div class="confetti" style="left:50%; background:#00ff7f; animation-duration:3.3s; animation-delay:1.4s;"></div>
                <div class="confetti" style="left:70%; background:#1e90ff; animation-duration:2.7s; animation-delay:0.6s;"></div>
                <div class="confetti" style="left:90%; background:#ff6347; animation-duration:3.9s; animation-delay:2.2s;"></div>
                <div class="confetti" style="left:20%; background:#9932cc; animation-duration:3.5s; animation-delay:1.7s;"></div>
                <div class="confetti" style="left:40%; background:#ffd700; animation-duration:2.6s; animation-delay:0.2s;"></div>
                <div class="confetti" style="left:60%; background:#adff2f; animation-duration:3.8s; animation-delay:1.1s;"></div>
                <div class="confetti" style="left:80%; background:#ff1493; animation-duration:3.2s; animation-delay:2.5s;"></div>
                <div class="confetti" style="left:100%; background:#00bfff; animation-duration:2.4s; animation-delay:0.8s;"></div>
            </div>
            {{end}}

            <div id="clock-content" class="contents">
                {{if .Holiday}}
                <div class="absolute top-0 left-0 w-full p-2 bg-amber-500/20 border-b border-amber-500/30 flex items-center justify-center space-x-2">
                    <i data-lucide="party-popper" class="w-3 h-3 text-amber-500"></i>
                    <span class="text-[11px] font-black uppercase tracking-[0.2em] text-amber-500 italic">{{.Holiday.Name}}</span>
                    <i data-lucide="party-popper" class="w-3 h-3 text-amber-500"></i>
                </div>
                {{end}}
                <h1 id="clock" class="fluid-clock font-extrabold tracking-tighter text-base-content leading-none">00:00</h1>
                <p id="date" class="text-primary text-xs md:text-lg font-bold mt-1 capitalize"></p>
                {{if .UpcomingHolidays}}
                <div class="mt-3 pt-3 border-t border-base-300/50">
                    <div class="text-[11px] font-bold text-base-content/70 uppercase tracking-widest mb-2 italic">Próximos Feriados:</div>
                    <div class="space-y-1.5">
                        {{range .UpcomingHolidays}}
                        <div class="flex items-center justify-between text-sm {{if .IsNear}}text-amber-400 holiday-item-near{{else}}text-amber-500/90{{end}} font-bold transition-all duration-300">
                            <span class="flex items-center">
                                {{if .IsNear}}<i data-lucide="sparkles" class="w-3 h-3 mr-1.5 text-amber-400"></i>{{end}}
                                {{.Name}}
                            </span>
                            <span class="text-base-content/60 text-[11px] ml-2 uppercase">{{.DayName}} {{.DateStr}}</span>
                        </div>
                        {{end}}
                    </div>
                </div>
                {{end}}
            </div>
        </div>

        <!-- 2. Clima y 3. Deportes -->
        <div id="weather-display" hx-get="/weather" hx-trigger="load, every 60s, refreshWeather from:body" hx-swap="innerHTML" class="contents">
             <div class="lg:col-span-7 flex items-center justify-center bg-base-200/50 rounded-[2.5rem] border border-base-300/20 p-4 h-full">
                <div class="w-8 h-8 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
             </div>
        </div>
    </div>

    <!-- Footer: Firma a la izquierda, Configuración a la derecha -->
    <div class="mt-1 mb-1 flex items-center justify-between px-2">
        <div class="text-[10px] font-bold text-base-content/40 uppercase tracking-[0.3em]">
            Homedash by <span class="text-primary font-black opacity-60">kastor</span>
        </div>
        <button onclick="toggleModal()" class="text-[10px] font-black text-indigo-400 hover:text-indigo-300 uppercase tracking-widest bg-indigo-500/10 px-4 py-1.5 rounded-full border border-indigo-500/20 transition-all flex items-center shadow-lg hover:shadow-indigo-500/10 active:scale-95">
            <i data-lucide="settings" class="w-3.5 h-3.5 mr-2"></i> Configuración
        </button>
    </div>
{{end}}
